name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          APP_DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test_app_db"
          ANALYTICS_DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test_analytics_db"
          GEMINI_API_KEY: "dummy-key-for-ci"
          ENCRYPTION_KEY: "aDPBKXQ8r1Sub1kjOUNgoX7fb7WIIv_AQER6Pn06wnU="
        run: pytest -v